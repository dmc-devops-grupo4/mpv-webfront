apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpv-webfront
  namespace: mesa-partes
  labels:
    app: mpv-webfront
    env: ${ENV}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mpv-webfront
  template:
    metadata:
      labels:
        app: mpv-webfront
        env: ${ENV}
    spec:
      containers:
        - name: mpv-webfront
          image: ${IMAGE}
          ports:
            - containerPort: 80
          env:
            - name: API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: mdpv-config
                  key: API_GATEWAY_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mpv-webfront
  namespace: mesa-partes
spec:
  type: LoadBalancer
  selector:
    app: mpv-webfront
  ports:
    - port: 80
      targetPort: 80
