server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Azure: sin esto, nginx cachea la IP del gateway al
    # arrancar y nunca la refresca, causando 502 cuando el ingress de
    # Container Apps rota de IP.
    resolver 168.63.129.16 valid=10s;
    set $gateway "${API_GATEWAY_URL}";

    # El ingress de Container Apps enruta por SNI y por el header Host (una
    # sola IP sirve a varios Container Apps). Con proxy_pass a una variable,
    # nginx no manda el SNI automaticamente, y $host seria el host del
    # webfront (el del cliente), no el del gateway -> hay que forzar ambos.
    proxy_ssl_server_name on;

    # Proxy hacia el api-gateway (URL resuelta en runtime via ${API_GATEWAY_URL})
    # Cada bloque quita el sufijo /api que agrega el Angular y deja el prefijo
    # /msXXX que el api-gateway usa para enrutar via Eureka.
    # rewrite ... break reconstruye la ruta antes del proxy_pass: cuando
    # proxy_pass usa una variable, nginx NO reemplaza el prefijo del location
    # automaticamente (a diferencia de una URI estatica), asi que hay que
    # armar la ruta final a mano.
    location /msseguridad/api/ {
        rewrite ^/msseguridad/api/(.*)$ /msseguridad/$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mspersona/api/ {
        rewrite ^/mspersona/api/(.*)$ /mspersona/$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /msarchivo/api/ {
        rewrite ^/msarchivo/api/(.*)$ /msarchivo/$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mstramites/api/ {
        rewrite ^/mstramites/api/(.*)$ /mstramites/$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /msnotificaciones/api/ {
        rewrite ^/msnotificaciones/api/(.*)$ /msnotificaciones/$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
